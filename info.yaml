# Tiny Tapeout project information
project:
  title:        "tiny-sparse-acc"      # Project title
  author:       "Aram Yun"      # Your name
  discord:      "ramzxc"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "tiny-acc"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     1000000        # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tiny_sparse_acc_ramzxc"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  # Original SystemVerilog remains in src/*.sv; regenerate with scripts/generate_verilog.py.
  source_files:
    - "generated/design.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: "UART RX"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "Host ready"
  uo[1]: "TPU available"
  uo[2]: "Flash busy"
  uo[3]: "Synchronize seen"
  uo[4]: "UART TX"
  uo[5]: "Flash error bit 0"
  uo[6]: "Flash error bit 1"
  uo[7]: "Flash error bit 2"

  # Bidirectional pins
  uio[0]: "Flash CS_n"
  uio[1]: "Flash IO0"
  uio[2]: "Flash IO1"
  uio[3]: "Flash SCK"
  uio[4]: "Flash IO2"
  uio[5]: "Flash IO3"
  uio[6]: "PSRAM CS_n 0 (high)"
  uio[7]: "PSRAM CS_n 1 (high)"

# Do not change!
yaml_version: 6
