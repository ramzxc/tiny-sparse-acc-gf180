name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build Verilator 5.052 (cocotb requires at least 5.036)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf flex bison help2man g++ make
          git clone --depth 1 --branch v5.052 https://github.com/verilator/verilator.git "$RUNNER_TEMP/verilator"
          cd "$RUNNER_TEMP/verilator"
          autoconf
          ./configure --prefix="$RUNNER_TEMP/verilator-install"
          make -j2
          make install
          echo "$RUNNER_TEMP/verilator-install/bin" >> "$GITHUB_PATH"

      - name: Install sv2v 0.0.13
        shell: bash
        run: |
          curl -L --fail https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip -o "$RUNNER_TEMP/sv2v.zip"
          unzip -q "$RUNNER_TEMP/sv2v.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sv2v-Linux" >> "$GITHUB_PATH"

      - name: Check generated Verilog
        run: python3 scripts/generate_verilog.py --check

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml

      - name: Run UART and QSPI integration test
        run: bash test/check_import.sh

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
