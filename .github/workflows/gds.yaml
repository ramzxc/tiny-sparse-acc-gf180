name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout GDS action
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: ttgf26c
          path: .tt-gds-action

      - name: Add build diagnostics
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          action = Path('.tt-gds-action/action.yml')
          original = 'run: ./tt/tt_tool.py --harden $TT_ARGS'
          replacement = ('run: python3 scripts/monitor_gds.py -- '
                         './tt/tt_tool.py --harden $TT_ARGS')
          text = action.read_text()
          if text.count(original) != 1:
              raise SystemExit('GDS action changed; review diagnostic wrapper insertion')
          action.write_text(text.replace(original, replacement))
          PYTHON

      - name: Build GDS
        uses: ./.tt-gds-action
        with:
          pdk: gf180mcuD

      - name: Check physical core is included in final GDS
        run: python3 scripts/check_core_gds.py runs/wokwi/final/gds/*.gds tt_submission/*.gds

      - name: Summarize core and wrapper
        run: python3 scripts/summarize_hardmacro.py runs/wokwi/final/gds/*.gds >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gds-diagnostics
          path: test/output/gds_diagnostics/
          if-no-files-found: warn

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttgf26c

  gl_test:
    # The composite action runs make clean before GATES=yes make.
    env:
      GATES: "yes"
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttgf26c

  viewer:
    if: github.ref == 'refs/heads/main'
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttgf26c
